services:
  ottie:
    build: .
    image: ottie:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind to localhost; put a TLS reverse proxy in front for anything remote
    environment:
      APP_SESSION_KEY: ${APP_SESSION_KEY:-}
      APP_SERVER_KEY: ${APP_SERVER_KEY:-}
      OTTIE_INSECURE_COOKIES: ${OTTIE_INSECURE_COOKIES:-}
      OTTIE_DEBUG_LOGS: ${OTTIE_DEBUG_LOGS:-}
      OTTIE_LISTEN_ADDR: 0.0.0.0:8080
      OTTIE_DB_PATH: /app/data/ottie.db

      # Optional 2FA Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Optional 2FA Text/Phone (SMS): SMSGate (FOSS) or Twilio
      SMSGATE_URL: ${SMSGATE_URL:-}
      SMSGATE_LOGIN: ${SMSGATE_LOGIN:-}
      SMSGATE_PASSWORD: ${SMSGATE_PASSWORD:-}
      SMSGATE_TOKEN: ${SMSGATE_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    volumes:
      - ottie_data:/app/data

volumes:
  ottie_data:
