name: Release Build & Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Test Suite & Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Frontend Lint, Test & Build
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run lint
          bun run test
          bun run build
          cd ..

      - name: Backend Vet & Test
        run: |
          go vet ./...
          go test -v ./...

  build-binaries:
    name: Build & Release Multi-Platform Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Build Frontend SPA
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run build
          cd ..

      - name: Compile Multi-Platform Binaries
        env:
          CGO_ENABLED: '0'
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${TAG_NAME}"

          # Linux AMD64 & ARM64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-linux-arm64 .

          # Windows AMD64 & ARM64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-windows-arm64.exe .

          # macOS (Darwin) AMD64 & Apple Silicon (ARM64)
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/ottie-darwin-arm64 .

          # Generate SHA256 Checksums
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release with Binary Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          name: Ottie Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  docker-build-push:
    name: Package & Publish Alpine Docker Container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up QEMU (Multi-Arch Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build & Push Multi-Arch Alpine Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
