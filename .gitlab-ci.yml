stages:
  - test
  - build-frontend
  - build-binaries
  - package
  - release

variables:
  CGO_ENABLED: "0"

# Run Unit Testing and Linting on everything
test:backend:
  stage: test
  image: golang:1.22-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev
  script:
    - go vet ./...
    - go test -v ./...

test:frontend:
  stage: test
  image: oven/bun:1-alpine
  script:
    - cd frontend
    - bun install --frozen-lockfile || bun install
    - bun run lint
    - bun run test
    - bun run build

# Build Frontend SPA Bundle as an artifact for binary compilation
build:frontend:
  stage: build-frontend
  image: oven/bun:1-alpine
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - cd frontend
    - bun install --frozen-lockfile || bun install
    - bun run build
  artifacts:
    name: "ottie-frontend-dist-${CI_COMMIT_TAG}"
    paths:
      - frontend/dist/
    expire_in: 1 day

# Build Cross-Platform Standalone Binaries on Tag Push
build:binaries:
  stage: build-binaries
  image: golang:1.22-alpine
  needs:
    - job: test:backend
    - job: test:frontend
    - job: build:frontend
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - apk add --no-cache git coreutils
  script:
    - mkdir -p dist
    - LDFLAGS="-s -w -X main.Version=${CI_COMMIT_TAG}"
    - echo "Building Ottie binaries for ${CI_COMMIT_TAG} with embedded React SPA..."
    - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-linux-amd64 .
    - GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-linux-arm64 .
    - GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-windows-amd64.exe .
    - GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-windows-arm64.exe .
    - GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-darwin-amd64 .
    - GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ottie-darwin-arm64 .
    - cd dist && sha256sum * > checksums.txt && cd ..
  artifacts:
    name: "ottie-${CI_COMMIT_TAG}-binaries"
    paths:
      - dist/
    expire_in: 30 days

# Package & Push Alpine Docker Container to GitLab Container Registry
package:docker:
  stage: package
  image: docker:26
  services:
    - docker:26-dind
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Packaging lightweight Alpine Docker image for ${CI_COMMIT_TAG}..."
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Create GitLab Release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:binaries
      artifacts: true
    - job: package:docker
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Ottie Release $CI_COMMIT_TAG'
    description: |
      Ottie TOTP Manager release $CI_COMMIT_TAG with React + TypeScript + Emotion SPA.
      - **Multi-Platform Binaries**: Linux (amd64/arm64), Windows (amd64/arm64), macOS (Intel/Apple Silicon)
      - **Docker Image**: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG` (Alpine minimal container)
