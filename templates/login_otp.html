<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Verification - Ottie</title>
  <link rel="icon" type="image/svg+xml" href="/static/ottie.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-page: #f6faf5; --grid-line: #e5ede3; --primary: #059669; --primary-hover: #047857;
      --primary-light: #ecfdf5; --primary-border: #a7f3d0; --card-bg: #ffffff; --card-border: #e2e8f0;
      --text-dark: #0f172a; --text-muted: #475569; --text-dim: #94a3b8;
      --pastel-green: #dcfce7; --pastel-green-border: #86efac; --pastel-green-text: #14532d;
      --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px; --radius-pill: 9999px;
      --shadow-sm: 0 2px 4px rgba(15,23,42,0.04); --shadow-card: 0 4px 20px -2px rgba(15,23,42,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-page); background-image: linear-gradient(var(--grid-line) 1.2px, transparent 1.2px), linear-gradient(90deg, var(--grid-line) 1.2px, transparent 1.2px); background-size: 32px 32px; color: var(--text-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 80px; }
    .app-wrapper { width: 100%; max-width: 440px; margin: 0 auto; }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-title { font-size: 36px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 8px; }
    .river-wave-accent { display: flex; justify-content: center; align-items: center; margin: 4px auto 0; height: 16px; }
    .form-card-box { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 28px 24px; box-shadow: var(--shadow-card); margin-bottom: 20px; }
    .form-group-item { margin-bottom: 18px; text-align: left; }
    .form-field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
    .form-input-field { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); background: #f8faf7; border: 1.5px solid var(--card-border); color: var(--text-dark); font-size: 20px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: 4px; text-align: center; outline: none; }
    .form-input-field:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
    .form-help-text { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
    .btn-pill-primary { width: 100%; padding: 12px 20px; background: var(--primary); color: #ffffff; font-size: 14px; font-weight: 700; font-family: inherit; border: none; border-radius: var(--radius-pill); cursor: pointer; box-shadow: 0 4px 12px rgba(5,150,105,0.25); }
    .btn-pill-primary:hover { background: var(--primary-hover); }
    .alert-message { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .alert-message.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-title">
      <span>Ottie</span>
      <img src="/static/ottie.svg" width="40" height="40" alt="Ottie">
    </div>
    <div class="river-wave-accent">
      <svg width="84" height="16" viewBox="0 0 84 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5C10 1 16 9 22 5C28 1 34 9 40 5C46 1 52 9 58 5C64 1 70 9 76 5C79 3 81 4 82 5" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M12 12C18 8 24 16 30 12C36 8 42 16 48 12C54 8 60 16 66 12C70 9 72 10.5 74 12" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- OTP Verification Card -->
  <div class="form-card-box" style="text-align: center;">
    <div style="margin-bottom: 16px;">
      <img src="/static/otter-shield.svg" width="48" height="48" alt="Shield" style="margin-bottom: 8px;">
      <div style="font-size: 22px; font-weight: 800; margin-bottom: 4px;">Den Gate Verification</div>
      <p class="form-help-text" style="font-size: 13px; margin-bottom: 16px;">
        A 6-digit passcode was dispatched to <strong>{{.Dest}}</strong>.
      </p>
    </div>

    {{if .Error}}
      <div class="alert-message error" style="text-align: left;">
        <span>{{.Error}}</span>
      </div>
    {{end}}

    <div id="otp-form-pane">
      <form method="post" action="/login/otp">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">

        <div class="form-group-item">
          <input type="text" id="code" name="code" class="form-input-field" required autofocus autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" placeholder="123456" maxlength="6">
          <div class="form-help-text" style="text-align: center;">Passcode expires in 5 minutes.</div>
        </div>

        <button type="submit" class="btn-pill-primary" style="margin-top: 4px;">
          Verify Passcode & Enter Den
        </button>
      </form>

      <div style="margin-top: 18px; border-top: 1px solid var(--card-border); padding-top: 14px;">
        <button type="button" style="background: none; border: none; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer; text-decoration: underline;" onclick="toggleRecoveryPane()">
          Lost access? Rebuild with 12 recovery pebbles
        </button>
      </div>
    </div>

    <!-- Recovery Key Fallback Pane -->
    <div id="recovery-form-pane" style="display: none; text-align: left;">
      <form method="post" action="/recover">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">

        <div class="form-group-item">
          <label class="form-field-label" for="recovery_code">12-Pebble Recovery Phrase</label>
          <textarea name="recovery_phrase" class="form-input-field" style="height: 70px; font-size: 13px; letter-spacing: 1px;" placeholder="pebble1 pebble2 pebble3..." required></textarea>
          <div class="form-help-text">Enter your 12 recovery pebbles to unlock your den.</div>
        </div>

        <button type="submit" class="btn-pill-primary" style="margin-top: 4px;">
          Unlock Den with Recovery Phrase
        </button>
      </form>

      <div style="margin-top: 14px; text-align: center;">
        <button type="button" style="background: none; border: none; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;" onclick="toggleRecoveryPane()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          Back to 6-digit passcode
        </button>
      </div>
    </div>

    <div style="margin-top: 16px;">
      <a href="/login" style="font-size: 13px; font-weight: 700; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
        Back to login
      </a>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/static/app.js"></script>
<script>
function toggleRecoveryPane() {
  const otpPane = document.getElementById('otp-form-pane');
  const recPane = document.getElementById('recovery-form-pane');
  if (recPane.style.display === 'none') {
    otpPane.style.display = 'none';
    recPane.style.display = 'block';
  } else {
    recPane.style.display = 'none';
    otpPane.style.display = 'block';
  }
}
</script>
</body>
</html>
