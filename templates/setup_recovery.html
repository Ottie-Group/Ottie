<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save Your Recovery Phrase - Ottie</title>
  <link rel="icon" type="image/svg+xml" href="/static/ottie.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-page: #f6faf5; --grid-line: #e5ede3; --primary: #059669; --primary-hover: #047857;
      --primary-light: #ecfdf5; --primary-border: #a7f3d0; --card-bg: #ffffff; --card-border: #e2e8f0;
      --text-dark: #0f172a; --text-muted: #475569; --text-dim: #94a3b8;
      --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px; --radius-pill: 9999px;
      --shadow-sm: 0 2px 4px rgba(15,23,42,0.04); --shadow-card: 0 4px 20px -2px rgba(15,23,42,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-page); background-image: linear-gradient(var(--grid-line) 1.2px, transparent 1.2px), linear-gradient(90deg, var(--grid-line) 1.2px, transparent 1.2px); background-size: 32px 32px; color: var(--text-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 80px; }
    .app-wrapper { width: 100%; max-width: 520px; margin: 0 auto; }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-title { font-size: 36px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 8px; }
    .river-wave-accent { display: flex; justify-content: center; align-items: center; margin: 4px auto 0; height: 16px; }
    .form-card-box { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 28px 24px; box-shadow: var(--shadow-card); margin-bottom: 20px; }
    .words-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
    @media (max-width: 480px) { .words-grid { grid-template-columns: repeat(2, 1fr); } }
    .word-chip { background: #f8faf7; border: 1.5px solid var(--card-border); border-radius: var(--radius-sm); padding: 8px 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-weight: 700; color: var(--text-dark); }
    .word-num { color: var(--text-dim); font-size: 11px; width: 16px; text-align: right; }
    .word-text { color: var(--primary); }
    .btn-pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; }
    .btn-pill-primary { background: var(--primary); color: #ffffff; width: 100%; padding: 12px; font-size: 14px; }
    .btn-pill-primary:hover { background: var(--primary-hover); }
    .btn-pill-outline { background: var(--card-bg); border: 1.5px solid var(--card-border); color: var(--text-dark); }
    .btn-pill-outline:hover { background: var(--primary-light); }
    .otter-emoji { display: inline-block; vertical-align: middle; object-fit: contain; flex-shrink: 0; }
    .otter-emoji.xs { width: 16px; height: 16px; }
    .otter-emoji.sm { width: 20px; height: 20px; }
    .otter-emoji.md { width: 26px; height: 26px; }
    .otter-emoji.lg { width: 40px; height: 40px; }
    .otter-emoji.xl { width: 56px; height: 56px; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-title">
      <span>Ottie</span>
      <img src="/static/ottie.svg" width="40" height="40" alt="Ottie">
    </div>
    <div class="river-wave-accent">
      <svg width="84" height="16" viewBox="0 0 84 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5C10 1 16 9 22 5C28 1 34 9 40 5C46 1 52 9 58 5C64 1 70 9 76 5C79 3 81 4 82 5" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M12 12C18 8 24 16 30 12C36 8 42 16 48 12C54 8 60 16 66 12C70 9 72 10.5 74 12" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="form-card-box" style="text-align: center;">
    <div style="margin-bottom: 8px;">
      <img src="/static/otter-pebble.svg" class="otter-emoji xl" alt="Recovery Pebbles">
    </div>
    <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">Your 12-Pebble Emergency Dam</h2>
    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">
      Write down and keep these <strong>12 secret pebbles</strong> in order. If water ever washes away your master key, this phrase will reconstruct your entire den without losing a single token.
    </p>

    <!-- 12 Words Grid -->
    <div class="words-grid">
      {{range $i, $w := .Words}}
        <div class="word-chip">
          <span class="word-num">{{add $i 1}}.</span>
          <span class="word-text">{{$w}}</span>
        </div>
      {{end}}
    </div>

    <!-- Quick Action Buttons -->
    <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;">
      <button type="button" class="btn-pill btn-pill-outline" onclick="copyToClipboard('{{.Phrase}}', '12-Pebble Recovery Phrase')">
        Copy 12 Pebbles
      </button>
      <button type="button" class="btn-pill btn-pill-outline" onclick="downloadRecoveryPhrase('{{.Username}}', '{{.Phrase}}')">
        Download .txt
      </button>
    </div>

    <form method="post" action="/setup/recovery">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button type="submit" class="btn-pill btn-pill-primary" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        <span>My Dam is Stored Safely</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
        <span>Dive In</span>
      </button>
    </form>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/static/app.js"></script>
<script>
function downloadRecoveryPhrase(username, phrase) {
  const content = `========================================\nOTTIE 12-WORD CRYPTOGRAPHIC RECOVERY PHRASE\n========================================\nUsername: ${username}\nCreated: ${new Date().toISOString()}\n\nRECOVERY SEED PHRASE:\n${phrase}\n\nKeep this secret and safe. It can be used to recover access to your Ottie 2FA vault.\n========================================`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ottie-recovery-phrase-${username}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Recovery phrase downloaded!');
}
</script>
</body>
</html>
