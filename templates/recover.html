<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Recovery - Ottie</title>
  <link rel="icon" type="image/svg+xml" href="/static/ottie.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-page: #f6faf5; --grid-line: #e5ede3; --primary: #059669; --primary-hover: #047857;
      --primary-light: #ecfdf5; --primary-border: #a7f3d0; --card-bg: #ffffff; --card-border: #e2e8f0;
      --text-dark: #0f172a; --text-muted: #475569; --text-dim: #94a3b8;
      --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px; --radius-pill: 9999px;
      --shadow-sm: 0 2px 4px rgba(15,23,42,0.04); --shadow-card: 0 4px 20px -2px rgba(15,23,42,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-page); background-image: linear-gradient(var(--grid-line) 1.2px, transparent 1.2px), linear-gradient(90deg, var(--grid-line) 1.2px, transparent 1.2px); background-size: 32px 32px; color: var(--text-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 80px; }
    .app-wrapper { width: 100%; max-width: 460px; margin: 0 auto; }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-title { font-size: 36px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 8px; }
    .river-wave-accent { display: flex; justify-content: center; align-items: center; margin: 4px auto 0; height: 16px; }
    .form-card-box { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 28px 24px; box-shadow: var(--shadow-card); margin-bottom: 20px; }
    .form-group-item { margin-bottom: 16px; text-align: left; }
    .form-field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
    .form-input-field, .form-textarea-field { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); background: #f8faf7; border: 1.5px solid var(--card-border); color: var(--text-dark); font-size: 14px; font-family: inherit; outline: none; }
    .form-textarea-field { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; line-height: 1.5; resize: vertical; min-height: 80px; }
    .form-input-field:focus, .form-textarea-field:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
    .btn-pill-primary { width: 100%; padding: 12px 20px; background: var(--primary); color: #ffffff; font-size: 14px; font-weight: 700; font-family: inherit; border: none; border-radius: var(--radius-pill); cursor: pointer; box-shadow: 0 4px 12px rgba(5,150,105,0.25); }
    .btn-pill-primary:hover { background: var(--primary-hover); }
    .alert-message { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .alert-message.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
    .otter-emoji { display: inline-block; vertical-align: middle; object-fit: contain; flex-shrink: 0; }
    .otter-emoji.xs { width: 16px; height: 16px; }
    .otter-emoji.sm { width: 20px; height: 20px; }
    .otter-emoji.md { width: 26px; height: 26px; }
    .otter-emoji.lg { width: 40px; height: 40px; }
    .otter-emoji.xl { width: 56px; height: 56px; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-title">
      <span>Ottie</span>
      <img src="/static/ottie.svg" width="40" height="40" alt="Ottie">
    </div>
    <div class="river-wave-accent">
      <svg width="84" height="16" viewBox="0 0 84 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5C10 1 16 9 22 5C28 1 34 9 40 5C46 1 52 9 58 5C64 1 70 9 76 5C79 3 81 4 82 5" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M12 12C18 8 24 16 30 12C36 8 42 16 48 12C54 8 60 16 66 12C70 9 72 10.5 74 12" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="form-card-box">
    <div style="text-align: center; margin-bottom: 16px;">
      <div style="margin-bottom: 8px;">
        <img src="/static/otter-dam.svg" class="otter-emoji xl" alt="Rebuild Dam">
      </div>
      <h2 style="font-size: 22px; font-weight: 800;">Rebuild Your River Dam</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        Place your 12 secret recovery pebbles in order to reconstruct your den with a fresh master key.
      </p>
    </div>

    {{if .Error}}
      <div class="alert-message error">
        <span>{{.Error}}</span>
      </div>
    {{end}}

    <form method="post" action="/recover">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">

      <div class="form-group-item">
        <label class="form-field-label" for="username">Otter Name (Username)</label>
        <input type="text" id="username" name="username" class="form-input-field" required autofocus value="{{.Username}}" placeholder="e.g. alex">
      </div>

      <div class="form-group-item">
        <label class="form-field-label" for="recovery_phrase">12-Pebble Recovery Phrase</label>
        <textarea id="recovery_phrase" name="recovery_phrase" class="form-textarea-field" required placeholder="pebble1 pebble2 pebble3 pebble4 pebble5 pebble6 pebble7 pebble8 pebble9 pebble10 pebble11 pebble12"></textarea>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Enter all 12 secret words in order, separated by spaces.</div>
      </div>

      <div class="form-group-item">
        <label class="form-field-label" for="new_password">New Master Den Key</label>
        <input type="password" id="new_password" name="new_password" class="form-input-field" required placeholder="Minimum 8 characters" autocomplete="new-password">
      </div>

      <div class="form-group-item">
        <label class="form-field-label" for="confirm_password">Confirm New Master Key</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input-field" required placeholder="Repeat new key" autocomplete="new-password">
      </div>

      <button type="submit" class="btn-pill-primary" style="margin-top: 6px;">
        Rebuild Den & Sign In
      </button>
    </form>

    <div style="margin-top: 18px; text-align: center;">
      <a href="/login" style="font-size: 13px; font-weight: 700; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
        Remembered your key? Swim back to sign in
      </a>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/static/app.js"></script>
</body>
</html>
