<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="otterFurShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a673d"/>
      <stop offset="100%" stop-color="#613b1c"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="2.5"/>

  <!-- Ears -->
  <circle cx="30" cy="28" r="8.5" fill="url(#otterFurShield)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="30" cy="28" r="4" fill="#fbcfe8"/>
  <circle cx="70" cy="28" r="8.5" fill="url(#otterFurShield)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="70" cy="28" r="4" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="26" ry="22" fill="url(#otterFurShield)" stroke="#4a2a11" stroke-width="2"/>
  
  <!-- Muzzle -->
  <ellipse cx="50" cy="51" rx="17" ry="12" fill="#fff8ed" stroke="#4a2a11" stroke-width="1.5"/>
  <circle cx="36" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="64" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Confident Happy Eyes -->
  <path d="M 37 43 Q 41 38 45 43" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 55 43 Q 59 38 63 43" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose & Smile -->
  <ellipse cx="50" cy="47" rx="3.5" ry="2.5" fill="#1e293b"/>
  <path d="M 46 51 Q 50 55 54 51" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Emerald Security Shield with Checkmark -->
  <g transform="translate(0, 10)">
    <path d="M 50 54 L 64 59 C 64 71 50 78 50 78 C 50 78 36 71 36 59 Z" fill="url(#shieldGrad)" stroke="#064e3b" stroke-width="1.8"/>
    <!-- Checkmark inside shield -->
    <path d="M 44 65 L 48 69 L 56 61" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Paws holding shield -->
    <circle cx="34" cy="63" r="5" fill="url(#otterFurShield)" stroke="#4a2a11" stroke-width="1.5"/>
    <circle cx="66" cy="63" r="5" fill="url(#otterFurShield)" stroke="#4a2a11" stroke-width="1.5"/>
  </g>
</svg>
