<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Otter Fur Gradients -->
    <linearGradient id="otterMainFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a673d"/>
      <stop offset="60%" stop-color="#7c4e28"/>
      <stop offset="100%" stop-color="#613b1c"/>
    </linearGradient>
    <linearGradient id="otterBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="100%" stop-color="#faecd7"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Big soft white sticker border circle -->
  <circle cx="70" cy="70" r="64" fill="#ffffff" filter="url(#stickerShadow)"/>
  <circle cx="70" cy="70" r="58" fill="#dcfce7" stroke="#86efac" stroke-width="2.5"/>

  <!-- Otter Ears -->
  <circle cx="42" cy="42" r="12" fill="url(#otterMainFur)" stroke="#4a2a11" stroke-width="2"/>
  <circle cx="42" cy="42" r="6" fill="#fbcfe8"/>
  <circle cx="98" cy="42" r="12" fill="url(#otterMainFur)" stroke="#4a2a11" stroke-width="2"/>
  <circle cx="98" cy="42" r="6" fill="#fbcfe8"/>

  <!-- Head Base -->
  <ellipse cx="70" cy="68" rx="38" ry="34" fill="url(#otterMainFur)" stroke="#4a2a11" stroke-width="2.5"/>

  <!-- Chubby Cheeks / Muzzle -->
  <ellipse cx="70" cy="78" rx="26" ry="19" fill="url(#otterBelly)" stroke="#4a2a11" stroke-width="1.8"/>

  <!-- Blushing Cheeks -->
  <circle cx="50" cy="76" r="7" fill="#fca5a5" opacity="0.6"/>
  <circle cx="90" cy="76" r="7" fill="#fca5a5" opacity="0.6"/>

  <!-- Big Sparkly Anime Eyes -->
  <!-- Left Eye (Happy Winking or Big Sparkle) -->
  <ellipse cx="54" cy="62" rx="6" ry="8" fill="#1f2937"/>
  <circle cx="52" cy="59" r="2.8" fill="#ffffff"/>
  <circle cx="56.5" cy="65" r="1.4" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="86" cy="62" rx="6" ry="8" fill="#1f2937"/>
  <circle cx="84" cy="59" r="2.8" fill="#ffffff"/>
  <circle cx="88.5" cy="65" r="1.4" fill="#ffffff"/>

  <!-- Cute Heart/Button Nose -->
  <path d="M64 71 C64 68, 76 68, 76 71 C76 76, 64 76, 64 71 Z" fill="#2d1808"/>
  <circle cx="68" cy="70" r="1.2" fill="#ffffff" opacity="0.8"/>

  <!-- Happy Cat-like Mouth -->
  <path d="M70 74 L70 77 M70 77 Q63 83 57 77 M70 77 Q77 83 83 77" 
        stroke="#4a2a11" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Tiny Cute Tongue -->
  <path d="M67 78 Q70 83 73 78 Z" fill="#fb7185"/>

  <!-- Whiskers -->
  <g stroke="#613b1c" stroke-width="1.8" stroke-linecap="round">
    <line x1="45" y1="75" x2="28" y2="72"/>
    <line x1="45" y1="80" x2="26" y2="81"/>
    <line x1="95" y1="75" x2="112" y2="72"/>
    <line x1="95" y1="80" x2="114" y2="81"/>
  </g>

  <!-- Paws holding mini 2FA green key badge -->
  <ellipse cx="50" cy="100" rx="9" ry="8" fill="url(#otterMainFur)" stroke="#4a2a11" stroke-width="2"/>
  <ellipse cx="90" cy="100" rx="9" ry="8" fill="url(#otterMainFur)" stroke="#4a2a11" stroke-width="2"/>

  <!-- Green Security Lock Badge in center -->
  <g transform="translate(70, 101)">
    <circle cx="0" cy="0" r="12" fill="url(#greenBadge)" stroke="#ffffff" stroke-width="2"/>
    <!-- Key icon -->
    <path d="M-4 -2 Q-4 -6 0 -6 Q4 -6 4 -2 L4 2 L2 2 L2 0 L-2 0 L-2 2 L-4 2 Z" fill="#ffffff"/>
    <circle cx="0" cy="-3" r="1.2" fill="#059669"/>
  </g>
</svg>
