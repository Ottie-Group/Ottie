<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="otterFurPebble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a673d"/>
      <stop offset="100%" stop-color="#613b1c"/>
    </linearGradient>
    <linearGradient id="pebbleStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="#fefce8" stroke="#fef08a" stroke-width="2.5"/>

  <!-- Ears -->
  <circle cx="30" cy="28" r="8.5" fill="url(#otterFurPebble)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="30" cy="28" r="4" fill="#fbcfe8"/>
  <circle cx="70" cy="28" r="8.5" fill="url(#otterFurPebble)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="70" cy="28" r="4" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="26" ry="22" fill="url(#otterFurPebble)" stroke="#4a2a11" stroke-width="2"/>
  
  <!-- Muzzle -->
  <ellipse cx="50" cy="51" rx="17" ry="12" fill="#fff8ed" stroke="#4a2a11" stroke-width="1.5"/>
  <circle cx="36" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="64" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Big Sparkly Eyes -->
  <circle cx="39" cy="42" r="4" fill="#1e293b"/>
  <circle cx="40.5" cy="40.5" r="1.5" fill="#ffffff"/>
  <circle cx="61" cy="42" r="4" fill="#1e293b"/>
  <circle cx="62.5" cy="40.5" r="1.5" fill="#ffffff"/>

  <!-- Nose & Smile -->
  <ellipse cx="50" cy="47" rx="3.5" ry="2.5" fill="#1e293b"/>
  <path d="M 46 51 Q 50 56 54 51" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Gleaming Emerald Pebble Held between paws -->
  <g transform="translate(0, 8)">
    <ellipse cx="50" cy="68" rx="14" ry="11" fill="url(#pebbleStone)" stroke="#064e3b" stroke-width="1.8"/>
    <!-- Sparkle on stone -->
    <path d="M 45 64 Q 48 64 48 61 Q 48 64 51 64 Q 48 64 48 67 Q 48 64 45 64 Z" fill="#ffffff"/>
    <ellipse cx="54" cy="71" rx="3" ry="1.5" fill="#a7f3d0" opacity="0.8"/>

    <!-- Paws Hugging Pebble -->
    <circle cx="36" cy="69" r="5.5" fill="url(#otterFurPebble)" stroke="#4a2a11" stroke-width="1.5"/>
    <circle cx="64" cy="69" r="5.5" fill="url(#otterFurPebble)" stroke="#4a2a11" stroke-width="1.5"/>
  </g>
</svg>
