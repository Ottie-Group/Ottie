<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="otterFurStash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a673d"/>
      <stop offset="100%" stop-color="#613b1c"/>
    </linearGradient>
    <linearGradient id="stashChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>

  <!-- Ears -->
  <circle cx="30" cy="28" r="8.5" fill="url(#otterFurStash)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="30" cy="28" r="4" fill="#fbcfe8"/>
  <circle cx="70" cy="28" r="8.5" fill="url(#otterFurStash)" stroke="#4a2a11" stroke-width="1.6"/>
  <circle cx="70" cy="28" r="4" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="26" ry="22" fill="url(#otterFurStash)" stroke="#4a2a11" stroke-width="2"/>
  
  <!-- Muzzle -->
  <ellipse cx="50" cy="51" rx="17" ry="12" fill="#fff8ed" stroke="#4a2a11" stroke-width="1.5"/>
  <circle cx="36" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="64" cy="50" r="4.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Excited Eyes -->
  <circle cx="39" cy="42" r="3.5" fill="#1e293b"/>
  <circle cx="40" cy="41" r="1.2" fill="#ffffff"/>
  <circle cx="61" cy="42" r="3.5" fill="#1e293b"/>
  <circle cx="62" cy="41" r="1.2" fill="#ffffff"/>

  <!-- Nose & Grin -->
  <ellipse cx="50" cy="47" rx="3.5" ry="2.5" fill="#1e293b"/>
  <path d="M 46 51 Q 50 56 54 51" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Vault Box in Paws -->
  <g transform="translate(0, 10)">
    <rect x="37" y="58" width="26" height="20" rx="4" fill="url(#stashChest)" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="47" y="64" width="6" height="6" rx="2" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
    <circle cx="50" cy="67" r="1.2" fill="#78350f"/>
    <!-- Plus symbol on box -->
    <path d="M 50 54 L 50 58 M 48 56 L 52 56" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>

    <!-- Paws -->
    <circle cx="34" cy="67" r="5.5" fill="url(#otterFurStash)" stroke="#4a2a11" stroke-width="1.5"/>
    <circle cx="66" cy="67" r="5.5" fill="url(#otterFurStash)" stroke="#4a2a11" stroke-width="1.5"/>
  </g>
</svg>
