<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="otterFurKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a673d"/>
      <stop offset="100%" stop-color="#613b1c"/>
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2.5"/>
  
  <!-- Ears -->
  <circle cx="30" cy="30" r="9" fill="url(#otterFurKey)" stroke="#4a2a11" stroke-width="1.8"/>
  <circle cx="30" cy="30" r="4.5" fill="#fbcfe8"/>
  <circle cx="70" cy="30" r="9" fill="url(#otterFurKey)" stroke="#4a2a11" stroke-width="1.8"/>
  <circle cx="70" cy="30" r="4.5" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="50" cy="48" rx="27" ry="24" fill="url(#otterFurKey)" stroke="#4a2a11" stroke-width="2"/>
  
  <!-- Muzzle -->
  <ellipse cx="50" cy="56" rx="18" ry="13" fill="#fff8ed" stroke="#4a2a11" stroke-width="1.5"/>
  <circle cx="36" cy="54" r="5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="64" cy="54" r="5" fill="#fca5a5" opacity="0.6"/>

  <!-- Eyes (Happy Arcs) -->
  <path d="M 38 45 Q 43 40 47 45" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 53 45 Q 57 40 62 45" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose & Mouth -->
  <ellipse cx="50" cy="52" rx="4" ry="3" fill="#1e293b"/>
  <path d="M 46 56 Q 50 60 54 56" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Golden Key Held in Paws -->
  <g transform="translate(0, 10)">
    <!-- Little Paws -->
    <circle cx="34" cy="68" r="6" fill="url(#otterFurKey)" stroke="#4a2a11" stroke-width="1.5"/>
    <circle cx="66" cy="68" r="6" fill="url(#otterFurKey)" stroke="#4a2a11" stroke-width="1.5"/>
    <!-- Key Shape -->
    <circle cx="40" cy="72" r="7" fill="url(#goldKey)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="40" cy="72" r="3" fill="#ecfdf5" stroke="#78350f" stroke-width="1.2"/>
    <rect x="46" y="70" width="22" height="4" rx="2" fill="url(#goldKey)" stroke="#78350f" stroke-width="1.2"/>
    <rect x="60" y="74" width="3" height="4" rx="1" fill="url(#goldKey)" stroke="#78350f" stroke-width="1"/>
    <rect x="65" y="74" width="3" height="5" rx="1" fill="url(#goldKey)" stroke="#78350f" stroke-width="1"/>
  </g>
</svg>
